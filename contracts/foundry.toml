[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# DeployAll.s.sol writes ../apps/web/demo-addresses.json (the one demo world)
# DeployPassportKit.s.sol writes deployments/<chainid>.json (addresses + startBlock for the subgraph/.env)
fs_permissions = [
    { access = "read-write", path = "../apps/web/" },
    { access = "write", path = "./deployments" },
]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/",
    "@uniswap/v4-core/=lib/uniswap-hooks/lib/v4-core/",
    "@uniswap/v4-periphery/=lib/uniswap-hooks/lib/v4-periphery/",
    "solmate/=lib/uniswap-hooks/lib/v4-core/lib/solmate/",
]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
